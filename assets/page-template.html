<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>IF.Link 微信公众号内容分页</title>
  <style>
    /* Copy the confirmed font files into the project's assets/fonts directory. */
    @font-face {
      font-family: "Source Han Sans SC";
      src: url("assets/fonts/SourceHanSansSC-VF.ttf") format("truetype");
      font-weight: 100 900;
    }
    @font-face {
      font-family: "Google Sans Flex";
      src: url("assets/fonts/GoogleSansFlex-VF.ttf") format("truetype");
      font-weight: 100 1000;
    }

    :root {
      --paper: #f4ebdd;
      --ink: #171513;
      --muted: #4b453f;
      --orange: #e64a13;
      --safe-x: 72px;
    }

    * { box-sizing: border-box; }
    html, body { width: 900px; margin: 0; }
    body {
      color: var(--ink);
      font-family: "Source Han Sans SC", sans-serif;
      background: #d9d3ca;
    }

    .page {
      position: relative;
      width: 900px;
      height: 1800px;
      overflow: hidden;
      background-color: var(--paper);
      background-position: center;
      background-size: cover;
    }

    .inner {
      position: relative;
      z-index: 1;
      width: 100%;
      height: 100%;
      padding: 78px var(--safe-x);
    }

    .eyebrow {
      color: var(--orange);
      font-size: 23px;
      font-weight: 720;
      letter-spacing: 3px;
    }

    .cover-title {
      width: 650px;
      margin: 52px 0 0;
      font-family: "Songti SC", "STSong", serif;
      font-size: 142px;
      line-height: .98;
      font-weight: 900;
      letter-spacing: -8px;
    }

    .orange { color: var(--orange); }

    .subtitle {
      margin-top: 58px;
      font-size: 34px;
      line-height: 1.35;
      font-weight: 760;
    }

    .tagline {
      margin-top: 16px;
      color: var(--muted);
      font-size: 28px;
      line-height: 1.6;
      font-weight: 520;
    }

    .organizer {
      margin-top: 34px;
      font-family: "Google Sans Flex", "Source Han Sans SC", sans-serif;
      font-size: 34px;
      line-height: 1.25;
      font-weight: 720;
    }

    .section-title {
      width: 690px;
      margin: 42px 0 0;
      font-size: 70px;
      line-height: 1.12;
      font-weight: 800;
    }

    .lead {
      width: 700px;
      margin-top: 62px;
      color: #292622;
      font-size: 31px;
      line-height: 1.75;
      font-weight: 510;
    }

    .card {
      width: 740px;
      margin-top: 56px;
      padding: 38px 42px;
      border: 1px solid rgba(55, 43, 32, .14);
      border-radius: 24px;
      background: rgba(255, 253, 248, .92);
    }

    .card h3 { margin: 0; font-size: 42px; line-height: 1.3; }
    .card p { margin: 22px 0 0; font-size: 29px; line-height: 1.68; }

    /* Replace these with generated backgrounds containing no text or logos. */
    .page-1 { background-image: linear-gradient(120deg, #f4ebdd, #f8f2e9); }
    .page-2 { background-image: linear-gradient(145deg, #f8f2e9, #f0e4d4); }

    /* Deterministic single-page capture targets. */
    .capture-targets {
      position: absolute;
      inset: 0 auto auto 0;
      width: 0;
      height: 0;
      overflow: hidden;
    }
    body:has(.capture-target:target) { height: 1800px; overflow: hidden; }
    body:has(#capture-1:target) .page:not(.page-1),
    body:has(#capture-2:target) .page:not(.page-2) { display: none; }
  </style>
</head>
<body>
  <div class="capture-targets" aria-hidden="true">
    <i class="capture-target" id="capture-1"></i>
    <i class="capture-target" id="capture-2"></i>
  </div>

  <section class="page page-1">
    <main class="inner">
      <div class="eyebrow">IF.LINK EVENT</div>
      <h1 class="cover-title"><span class="orange">活动</span><br>主标题</h1>
      <div class="subtitle">活动副标题</div>
      <div class="tagline">让每一种灵感，都有清晰的表达。</div>
      <div class="organizer">IF.Link × Partner<br><small>联合发起</small></div>
    </main>
  </section>

  <section class="page page-2">
    <main class="inner">
      <div class="eyebrow">01 / INTRODUCTION</div>
      <h2 class="section-title">把情景带入语句放在独立段落</h2>
      <p class="lead">正文保持稳定字号、充足行高和明确对比。内容过多时增加纵向空间或页面，不要在局部缩小文字。</p>
      <article class="card">
        <h3>模块标题</h3>
        <p>所有最终文字、Logo、二维码、时间轴和奖项数字均由 HTML 排版。</p>
      </article>
    </main>
  </section>
</body>
</html>
